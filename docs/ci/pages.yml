name: Deploy legal site to GitHub Pages

# Publishes the self-contained legal site (legal-site/) to GitHub Pages so the
# privacy policy has a public URL for App Store / Play Store submission.
#
# One-time setup by the repo owner: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". After the first run, the privacy policy URL is:
#   https://<owner>.github.io/<repo>/#privacy

on:
  push:
    branches: [main]
    paths: ['legal-site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: legal-site
      - id: deployment
        uses: actions/deploy-pages@v4
